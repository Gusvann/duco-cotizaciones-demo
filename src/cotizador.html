<style>@scope (#quote-host) {:scope {
  --ink: #13293d;
  --navy: #073b72;
  --blue: #0b65be;
  --bright: #47b5ff;
  --canvas: #f6faff;
  --white: #fff;
  --soft: #edf6ff;
  --line: #d4e4f2;
  --muted: #52687c;
  --red: #a52b31;
  --green: #21694e;
  --amber: #8b5c10;
  font-family: 'Public Sans', Arial, sans-serif;
  font-size: 15px;
  color: var(--ink);
  background: var(--canvas);
}
* {
  box-sizing: border-box;
}
:scope {
  margin: 0;
}
button,
input,
select,
textarea {
  font: inherit;
}
button {
  cursor: pointer;
}
button:disabled {
  cursor: not-allowed;
  opacity: 0.55;
}
button,
input,
select,
textarea {
  border: 1px solid #aabed1;
  border-radius: 7px;
  min-height: 44px;
}
button {
  padding: 10px 15px;
  background: white;
  color: var(--navy);
  font-weight: 600;
}
button.primary {
  background: var(--blue);
  border-color: var(--blue);
  color: white;
}
button.quiet {
  border-color: transparent;
  background: transparent;
}
button.danger {
  color: var(--red);
}
button:hover:not(:disabled) {
  box-shadow: 0 2px 8px #073b721c;
}
a {
  color: var(--blue);
}
:focus-visible {
  outline: 3px solid var(--blue);
  outline-offset: 3px;
}
input,
select,
textarea {
  width: 100%;
  padding: 10px 12px;
  color: var(--ink);
  background: white;
}
input[type='checkbox'] {
  width: 20px;
  min-height: 20px;
  accent-color: var(--blue);
}
input:read-only {
  background: #f2f5f8;
}
textarea {
  resize: vertical;
  min-height: 92px;
  line-height: 1.5;
}
fieldset {
  border: 0;
  margin: 0;
  padding: 0;
  min-width: 0;
}
fieldset:disabled {
  opacity: 0.8;
}
h1,
h2,
h3,
h4,
.number {
  font-family: Sora, Arial, sans-serif;
}
h1 {
  font-size: clamp(1.6rem, 3vw, 2.15rem);
  line-height: 1.28;
  margin: 0 0 12px;
  letter-spacing: -0.04em;
}
h1 span {
  color: var(--blue);
}
h2 {
  font-size: 1.2rem;
  margin: 0 0 10px;
  color: var(--blue);
}
h3 {
  font-size: 1rem;
  margin: 0 0 12px;
}
p {
  line-height: 1.55;
}
small,
.meta {
  font-size: 0.875rem;
  color: var(--muted);
}
.topbar {
  height: 78px;
  background: white;
  border-bottom: 1px solid var(--line);
  padding: 14px 32px;
  display: flex;
  align-items: center;
  gap: 26px;
}
.brand svg {
  width: 103px;
  height: 38px;
}
.workspace-name {
  border-left: 1px solid var(--line);
  padding-left: 24px;
  font-weight: 700;
}
.workspace-name span {
  color: var(--muted);
  font-weight: 400;
}
#session {
  margin-left: auto;
  position: relative;
}
.profile {
  position: relative;
}
.profile-trigger {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 5px 8px;
  border-color: transparent;
  background: transparent;
  text-align: left;
}
.profile-avatar {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  flex: 0 0 38px;
  background: var(--navy);
  color: white;
  font: 700 0.78rem Sora, Arial, sans-serif;
  letter-spacing: 0.03em;
}
.profile-label {
  display: grid;
  line-height: 1.2;
}
.profile-label strong {
  max-width: 180px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.profile-label small {
  margin-top: 3px;
}
.profile-chevron {

  async function submitClientAlta(retry=false) {
    const state=app.clientAlta;
    if(!state||!state.open||state.sending||!editable()||!['Account','Admin'].includes(app.user?.role)||app.lineCatalog)return;
    if(state.uncertain&&!retry)return;
    const name=state.name.trim();
    if(!name){state.error='Indica el nombre del cliente.';editor();return;}
    let contactEmail;
    try {contactEmail=D.contactEmail(state.contactEmail);} catch(e){state.error=e.message;editor();$('#client-alta-email')?.focus();return;}
    const q=app.q,epoch=app.epoch,owner=app.user.id,requestId=state.requestId;
    state.sending=true;state.error='';editor();
    try {
      const result=await api('clientCreate',{requestId,name,contact:state.contact,contactPhone:state.contactPhone,contactEmail,contactEmailContract:QuoteSchema.emailContract});
      if(app.q!==q||app.epoch!==epoch||app.user?.id!==owner||app.clientAlta!==state)return;
      finishClientAlta(result);
    } catch(e) {
      if(app.q!==q||app.epoch!==epoch||app.user?.id!==owner||app.clientAlta!==state)return;
      const definite=['VALIDATION','DUPLICATE_CLIENT','CONFLICT','FORBIDDEN','SCHEMA','WRITE_PAUSED'].includes(e.code);
      state.uncertain=!definite;
      state.error=definite?(e.message||'No se autorizó el alta.'):'Resultado pendiente de verificar. Conserva esta ventana y el mismo identificador; no crees otra alta.';
      state.sending=false;editor();
    }
  }
  async function verifyClientAlta() {

  async function fetchClientContact() {
    if(!editable()||app.busy||!app.q.client.id)return;
    const q=app.q,epoch=app.epoch,token=app.token,clientId=q.client.id;
    const lookup={quote:q,clientId,state:'loading',values:[q.contact,q.contactPhone,q.contactEmail],edited:!!(q.contact||q.contactPhone||q.contactEmail)||['contact','contactPhone','contactEmail'].some(field=>app.clientEditedFields.has(field))};app.contactLookup=lookup;
    const show=()=>{const node=$('#contact-feedback');if(node&&app.step===0)node.innerHTML=contactFeedback();};show();
    const current=()=>app.q===q&&app.epoch===epoch&&app.token===token&&q.client.id===clientId&&app.contactLookup===lookup&&editable();
    try {
      const result=await api('clientContact',{clientId});
      if(!current())return;
      if(result.clientId!==clientId)throw {code:'INTEGRITY'};
      const contact=D.str(result.contact,240),phone=D.str(result.contactPhone,60),contactEmail=D.contactEmail(result.contactEmail);
      if(lookup.edited||q.contact!==lookup.values[0]||q.contactPhone!==lookup.values[1]||q.contactEmail!==lookup.values[2])lookup.state='edited';
      else {
        q.contact=contact;q.contactPhone=phone;q.contactEmail=contactEmail;lookup.state='ready';lookup.empty=!contact&&!phone&&!contactEmail;dirty();

        const phoneNode=$('#contact-phone-group');if(phoneNode)phoneNode.outerHTML=phoneEditor();
      }
    }catch(e){if(!current())return;lookup.state='error';if(e.code==='UNAUTHORIZED')report(e);}
    show();
  }
  function phoneState() {
    const source=String(app.q?.contactPhone||'');
    if(app.phoneDraft?.quote===app.q&&app.phoneDraft.source===source)return app.phoneDraft;
    // Only a delimited international prefix + simple number + optional explicit extension is unambiguous.
    const parsed=/^(\+[1-9]\d{0,2}) +([0-9(][0-9 ()-]*?)(?: +ext\.? +(\d+))?$/i.exec(source);
    const match=parsed&&/\d/.test(parsed[2])?parsed:null;
    app.phoneDraft={quote:app.q,source,mode:!source||match?'split':'legacy',country:match?.[1]||(!source&&!app.q?.id?'+52':''),number:match?.[2]||'',extension:match?.[3]||'',extensionEnabled:!!match?.[3],errorControl:'',error:''};
    return app.phoneDraft;
  }

    const state=phoneState(),issue=[...app.inputErrors.values(),...app.issues].find(i=>i.target?.entity==='quote'&&i.target.field==='contactPhone');

  function markContactEdited(field) {

  function updatePhone(el) {
    if(!editable()||app.busy)return;
    const part=el.dataset.phonePart;
    if(!['country','number','extension','extensionEnabled'].includes(part))return;
    const state=phoneState();if(state.mode!=='split')return;
    beginCapture();markContactEdited('contactPhone');
    state[part]=part==='extensionEnabled'?el.checked:el.value;
    state.error='';state.errorControl='';
    const country=state.country.trim(),number=state.number.trim(),extension=state.extensionEnabled?state.extension.trim():'';
    const invalid=(control,message)=>{state.errorControl='contact-phone-'+control;state.error=message;};
    if(extension&&!number)invalid('number','Captura el número antes de agregar una extensión.');
    else if(number&&!/^\+[1-9]\d{0,2}$/.test(country))invalid('country','Indica la lada de país con + y de uno a tres dígitos.');
    else if(number&&(!/^[0-9(][0-9 ()-]*$/.test(number)||!/\d/.test(number)))invalid('number','El número debe contener dígitos; puede incluir espacios, paréntesis o guiones.');
    else if(extension&&!/^\d+$/.test(extension))invalid('extension','Usa dígitos en la extensión.');
    const composed=number?country+' '+number+(extension?' ext. '+extension:''):'';
    if(!state.error){try{D.str(composed,60);}catch(_){invalid(extension&&(country+' '+number).length<=60?'extension':'number','El teléfono completo, incluida lada y extensión, no debe superar 60 caracteres.');}}
    const issue=D.issue(app.q,'contactPhone',state.error,{},'INPUT_INVALID'),key=JSON.stringify(issue.target);
    app.inputErrors.delete(key);
    app.issues=app.issues.filter(i=>!(i.target?.entity==='quote'&&i.target.field==='contactPhone'));
    if(state.error)app.inputErrors.set(key,issue);
    else {app.q.contactPhone=composed;state.source=composed;}
    dirty();
    if(part==='extensionEnabled'){
      $('#contact-phone-group').outerHTML=phoneEditor();
      $('#contact-phone-extension-enabled')?.focus();
    }else{
      const group=$('#contact-phone-group');
      group?.querySelectorAll('input').forEach(node=>node.setAttribute('aria-invalid',String(!!state.error)));
      const error=$('#contact-phone-error');if(error)error.textContent=state.error;
    }
  }

  function breakdownWoodValues(){
    const draft=app.breakdownEditor;
    const values={area:'Pendiente',cubic:'Pendiente',waste:'Pendiente',paint:'Pendiente',jointed:'Pendiente',woodCost:'Pendiente'};
    if(draft?.kind!=='component'||draft.value.section!=='wood')return values;
    const m=draft.value,g=draft.group,item=partViewQuote().items.find(row=>row.id===draft.itemId);
    const invalidGeometry=Object.keys(draft.numericErrors||{}).some(key=>/\|data-break-field\|(quantity|purchaseQuantity|length|width)$/.test(key));
    if(m.detail?.woodCalculationRule===QuoteManufacturing_.woodRule){
      if(!invalidGeometry)try{
        const metrics=QuoteManufacturing_.woodMeasurements(item,m,g),format=(value,unit)=>value===null?'Pendiente':new Intl.NumberFormat('es-MX',{maximumFractionDigits:3}).format(Number(value))+' '+unit;
        values.area=format(metrics.areaM2,'m²');values.cubic=format(metrics.cubicFeet,'pies³');values.waste=format(metrics.cubicFeetWithWaste,'pies³');values.paint=format(metrics.paintM2,'m²');values.jointed=format(metrics.jointedM2,'m²');
      }catch(error){/* Invalid capture stays pending, not a retained previous result. */}
      values.woodCost=QuotePdf.money(breakdownDraftSubtotal());return values;
    }
    // Same existing physical-area rule. A purchase quantity is NOT a physical multiplier.
    if(!invalidGeometry){
      const dimensions=QuoteManufacturing_.dimensions(item,{...m,lengthUnit:g.lengthUnit}),quantity=D.decimal(m.quantity,3);
      const area=dimensions.surface&&!dimensions.pending&&quantity!==null?dimensions.length*dimensions.width*quantity/1000:null;
      if(area!==null&&Number.isFinite(area))values.area=new Intl.NumberFormat('es-MX',{maximumFractionDigits:3}).format(area)+' m²';
    }
    values.woodCost=QuotePdf.money(breakdownDraftSubtotal());
    // Historic unmarked thickness has no accredited unit; never reinterpret it.
    return values;
  }

function articlePanelRemove(kind,id,entryId){

    if(!window.confirm('¿Eliminar '+(entry.name||entry.category||'este renglón')+' del artículo? Los demás renglones se conservarán; sus relaciones afectadas quedarán pendientes.'))return false;

      const remaining=solidWoodEntries(id).filter(c=>c.id!==entryId);
      for(const c of remaining)if(c.adjustment?.componentIds)c.adjustment.componentIds=c.adjustment.componentIds.filter(member=>member!==entryId);

    }
    const candidate=breakdownClone(partViewQuote());candidate.manufacturing=breakdownModel(candidate);
    const selected=candidate.manufacturing.items.find(r=>r.itemId===id);
    if(kind==='process'){
      selected.processes=selected.processes.filter(p=>p.id!==entryId);
      for(const system of selected.finishSystems)system.layerIds=system.layerIds.filter(layer=>layer!==entryId);
    }else{
      selected.materials=selected.materials.filter(m=>m.id!==entryId);
      for(const p of selected.processes){
        if(p.target.kind==='components'){p.target.componentIds=p.target.componentIds.filter(member=>member!==entryId);if(!p.target.componentIds.length)p.target=breakdownTarget('pending');}
        if(p.source.kind==='included'&&p.source.includedInMaterialId===entryId){p.source.includedInMaterialId='';p.source.reviewed=false;}
        if(p.materialId===entryId){p.materialId='';p.source.reviewed=false;}
      }
      for(const system of selected.finishSystems)if(system.target.kind==='components'){system.target.componentIds=system.target.componentIds.filter(member=>member!==entryId);if(!system.target.componentIds.length)system.target=breakdownTarget('pending');}
    }

    breakdownApply(candidate,'Renglón eliminado');

  };
