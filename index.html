  --ink: #13293d;
  --navy: #073b72;
  --blue: #0b65be;
  --bright: #47b5ff;
  --canvas: #f6faff;
  --white: #fff;
  --soft: #edf6ff;
  --line: #d4e4f2;
  --muted: #52687c;
  --red: #a52b31;
  --green: #21694e;
  --amber: #8b5c10;
  font-family: 'Public Sans', Arial, sans-serif;
  font-size: 15px;
  color: var(--ink);
  background: var(--canvas);
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
}
button,
input,
select,
textarea {
  font: inherit;
}
button {
  cursor: pointer;
}
button:disabled {
  cursor: not-allowed;
  opacity: 0.55;
}
button,
input,
select,
textarea {
  border: 1px solid #aabed1;
  border-radius: 7px;
  min-height: 44px;
}
button {
  padding: 10px 15px;
  background: white;
  color: var(--navy);
  font-weight: 600;
}
button.primary {
  background: var(--blue);
  border-color: var(--blue);
  color: white;
}
button.quiet {
  border-color: transparent;
  background: transparent;
}
button.danger {
  color: var(--red);
}
button:hover:not(:disabled) {
  box-shadow: 0 2px 8px #073b721c;
}
a {
  color: var(--blue);
}
:focus-visible {
  outline: 3px solid var(--blue);
  outline-offset: 3px;
}
input,
select,
textarea {
  width: 100%;
  padding: 10px 12px;
  color: var(--ink);
  background: white;
}
input[type='checkbox'] {
  width: 20px;
  min-height: 20px;
  accent-color: var(--blue);
}
input:read-only {
  background: #f2f5f8;
}
textarea {
  resize: vertical;
  min-height: 92px;
  line-height: 1.5;
}
fieldset {
  border: 0;
  margin: 0;
  padding: 0;
  min-width: 0;
}
fieldset:disabled {
  opacity: 0.8;
}
h1,
h2,
h3,
h4,
.number {
  font-family: Sora, Arial, sans-serif;
}
h1 {
  font-size: clamp(1.6rem, 3vw, 2.15rem);
  line-height: 1.28;
  margin: 0 0 12px;
  letter-spacing: -0.04em;
}
h1 span {
  color: var(--blue);
}
h2 {
  font-size: 1.2rem;
  margin: 0 0 10px;
  color: var(--blue);
}
h3 {
  font-size: 1rem;
  margin: 0 0 12px;
}
p {
  line-height: 1.55;
}
small,
.meta {
  font-size: 0.875rem;
  color: var(--muted);
}
.topbar {
  height: 78px;
  background: white;
  border-bottom: 1px solid var(--line);
  padding: 14px 32px;
  display: flex;
  align-items: center;
  gap: 26px;
}
.brand svg {
  width: 103px;
  height: 38px;
}
.workspace-name {
  border-left: 1px solid var(--line);
  padding-left: 24px;
  font-weight: 700;
}
.workspace-name span {
  color: var(--muted);
  font-weight: 400;
}
#session {
  margin-left: auto;
  position: relative;
}
.profile {
  position: relative;
}
.profile-trigger {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 5px 8px;
  border-color: transparent;
  background: transparent;
  text-align: left;
}
.profile-avatar {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  flex: 0 0 38px;
  background: var(--navy);
  color: white;
  font: 700 0.78rem Sora, Arial, sans-serif;
  letter-spacing: 0.03em;
}
.profile-label {
  display: grid;
  line-height: 1.2;
}
.profile-label strong {
  max-width: 180px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.profile-label small {
  margin-top: 3px;
}
.profile-chevron {
  color: var(--muted);

  async function fetchClientContact() {
    if(!editable()||app.busy||!app.q.client.id)return;
    const q=app.q,epoch=app.epoch,token=app.token,clientId=q.client.id;
    const lookup={quote:q,clientId,state:'loading',values:[q.contact,q.contactPhone],edited:!!(q.contact||q.contactPhone)||app.clientEditedFields.has('contact')||app.clientEditedFields.has('contactPhone')};app.contactLookup=lookup;
    const show=()=>{const node=$('#contact-feedback');if(node&&app.step===0)node.innerHTML=contactFeedback();};show();
    const current=()=>app.q===q&&app.epoch===epoch&&app.token===token&&q.client.id===clientId&&app.contactLookup===lookup&&editable();
    try {
      const result=await api('clientContact',{clientId});
      if(!current())return;
      if(result.clientId!==clientId)throw {code:'INTEGRITY'};
      const contact=D.str(result.contact,240),phone=D.str(result.contactPhone,60);
      if(lookup.edited||q.contact!==lookup.values[0]||q.contactPhone!==lookup.values[1])lookup.state='edited';
      else {
        q.contact=contact;q.contactPhone=phone;lookup.state='ready';lookup.empty=!contact&&!phone;dirty();

        app.phoneDraft=null;
        const phoneNode=$('#contact-phone-group');if(phoneNode)phoneNode.outerHTML=phoneEditor();

    show();
  }
  function phoneState() {

    const parsed=/^(\+[1-9]\d{0,2}) +([0-9(][0-9 ()-]*?)(?: +ext\.? +(\d+))?$/i.exec(source);
    const match=parsed&&/\d/.test(parsed[2])?parsed:null;
    app.phoneDraft={quote:app.q,source,mode:!source||match?'split':'legacy',country:match?.[1]||(!source&&!app.q?.id?'+52':''),number:match?.[2]||'',extension:match?.[3]||'',extensionEnabled:!!match?.[3],errorControl:'',error:''};
    return app.phoneDraft;
  }

  function updatePhone(el) {
    if(!editable()||app.busy)return;

    if(!['country','number','extension','extensionEnabled'].includes(part))return;
    const state=phoneState();if(state.mode!=='split')return;

    state[part]=part==='extensionEnabled'?el.checked:el.value;
    state.error='';state.errorControl='';
    const country=state.country.trim(),number=state.number.trim(),extension=state.extensionEnabled?state.extension.trim():'';
    const invalid=(control,message)=>{state.errorControl='contact-phone-'+control;state.error=message;};
    if(extension&&!number)invalid('number','Captura el número antes de agregar una extensión.');
    else if(number&&!/^\+[1-9]\d{0,2}$/.test(country))invalid('country','Indica la lada de país con + y de uno a tres dígitos.');
    else if(number&&(!/^[0-9(][0-9 ()-]*$/.test(number)||!/\d/.test(number)))invalid('number','El número debe contener dígitos; puede incluir espacios, paréntesis o guiones.');
    else if(extension&&!/^\d+$/.test(extension))invalid('extension','Usa dígitos en la extensión.');
    const composed=number?country+' '+number+(extension?' ext. '+extension:''):'';
    if(!state.error){try{D.str(composed,60);}catch(_){invalid(extension&&(country+' '+number).length<=60?'extension':'number','El teléfono completo, incluida lada y extensión, no debe superar 60 caracteres.');}}
    const issue=D.issue(app.q,'contactPhone',state.error,{},'INPUT_INVALID'),key=JSON.stringify(issue.target);
    app.inputErrors.delete(key);
    app.issues=app.issues.filter(i=>!(i.target?.entity==='quote'&&i.target.field==='contactPhone'));
    if(state.error)app.inputErrors.set(key,issue);
    else {app.q.contactPhone=composed;state.source=composed;}
    dirty();

      $('#contact-phone-group').outerHTML=phoneEditor();
      $('#contact-phone-extension-enabled')?.focus();
    }else{
      const group=$('#contact-phone-group');
      group?.querySelectorAll('input').forEach(node=>node.setAttribute('aria-invalid',String(!!state.error)));

    }
  }

  function itemMeasureSummary(item) {
    if(['Servicio','Lote'].includes(item.unit))return 'Sin medidas físicas';
    const specs=(item.specs||[]).filter(s=>item.unit!=='Metro'||s.type==='Largo');
    const values=specs.map(s=>s.na?'No aplica':s.value?String(s.value)+' '+(s.unit||''):'Por definir');
    return values.every(value=>value==='Por definir')?'Medidas por definir':values.join(' × ');
  }
  function itemMeasureUnit(item) {
    const units=[...new Set((item.specs||[]).filter(s=>!s.na&&s.unit).map(s=>s.unit))];
    return units.length===1?units[0]:units[0]||'';
  }
  const technicalMaterialTypes=[
    ['wood','Madera maciza','Especie, espesor, medidas y merma.'],
    ['board','Tablero','Sustrato, recubrimiento y medidas.'],
    ['metal','Metal / Herrería','Lámina o tubular, con datos distintos.'],
    ['consumable','Insumo / Herraje','Concepto y cantidad por producto.'],
    ['other','Otro material','Descripción técnica sin fórmula inventada.'],
  ];
  const technicalProcessTypes=[
    ['cnc','CNC / Láser','Corte o mecanizado.'],
    ['finish','Acabado','Tratamiento o terminación.'],
    ['weave','Tejido','Trabajo de tejido.'],
    ['maquila','Maquila externa','Servicio técnico externo.'],
    ['other','Otro proceso','Actividad técnica adicional.'],
  ];
  const techName=(kind,type)=>
    (kind==='materials'?technicalMaterialTypes:technicalProcessTypes).find(row=>row[0]===type)?.[1]||type;
  const techNumber=(value,allowZero=false)=>{
    if(value===''||value==null||!/^\d+(?:\.\d+)?$/.test(String(value)))return null;
    const number=Number(value);
    return Number.isFinite(number)&&(allowZero?number>=0:number>0)?number:null;
  };
  function techPartDimension(item,type) {
    if(['Servicio','Lote'].includes(item.unit))return null;
    const spec=item.specs.find(row=>row.type===type);
    if(!spec||spec.na||techNumber(spec.value)===null||!['mm','cm','m'].includes(spec.unit))return null;
    return {value:String(spec.value),unit:spec.unit};
  }
  function techDimensions(item,entry,tube=false) {
    const f=entry.fields;
    if(f.measureSource==='own'){
      if(!['mm','cm','m'].includes(f.ownUnit))return null;
      if(techNumber(f.ownLength)===null||(!tube&&techNumber(f.ownWidth)===null))return null;
      return {length:Number(f.ownLength),width:tube?null:Number(f.ownWidth),unit:f.ownUnit};
    }
    const length=techPartDimension(item,'Largo'),width=tube?null:techPartDimension(item,'Ancho');
    if(!length||(!tube&&!width)||width&&length.unit!==width.unit)return null;
    return {length:Number(length.value),width:width?Number(width.value):null,unit:length.unit};
  }
  function techArea(item,entry) {
    if(!['wood','board'].includes(entry.type)&&!(entry.type==='metal'&&entry.fields.subtype==='sheet'))return null;
    const dimensions=techDimensions(item,entry),quantity=techNumber(entry.fields.quantity);
    if(!dimensions||quantity===null)return {pending:true};
    const meters={mm:0.001,cm:0.01,m:1}[dimensions.unit];
    const per=quantity*dimensions.length*dimensions.width*meters*meters;
    const commercial=techNumber(item.quantity);
    return {per,total:commercial===null?null:per*commercial};
  }
  function techComplete(item,entry,kind) {
    const f=entry.fields,has=value=>String(value||'').trim().length>0,qty=()=>techNumber(f.quantity)!==null;
    if(kind==='materials'){
      if(entry.type==='wood')return has(f.species)&&has(f.thickness)&&qty()&&techNumber(f.waste,true)!==null&&techNumber(f.waste,true)<=100&&!!techDimensions(item,entry);
      if(entry.type==='board')return has(f.substrate)&&has(f.coating)&&has(f.thickness)&&qty()&&!!techDimensions(item,entry);
      if(entry.type==='metal'&&f.subtype==='sheet')return qty()&&!!techDimensions(item,entry);
      if(entry.type==='metal'&&f.subtype==='tube')return has(f.profile)&&qty()&&!!techDimensions(item,entry,true);
      if(entry.type==='consumable')return has(f.concept)&&qty()&&has(f.unit);
      if(entry.type==='other')return has(f.name)&&qty()&&has(f.unit);
      return false;
    }
    if(entry.type==='cnc')return ['CNC','Láser'].includes(f.mode)&&has(f.description)&&['Interna','Externa','Pendiente de definir'].includes(f.execution);

  function assertConfirmation(op,data) {

      throw {code:'CONFIRMATION_MISMATCH',message:'La lectura no coincide con la versión y revisión del envío.'};
    if(op.action==='save') {
      if(data.meta.state!=='Borrador'||JSON.stringify(capturedView(op.input.quote))!==JSON.stringify(capturedView(D.sanitize(q))))
        throw {code:'CONFIRMATION_MISMATCH',message:'La lectura no coincide con el contenido capturado. El envío necesita verificarse.'};
      if(q.account!==(op.input.quote.account||op.owner)||q.designer!==op.input.quote.designer)
        throw {code:'CONFIRMATION_MISMATCH',message:'Los responsables cambiaron; revisa el resultado del envío.'};
      const canonical=x=>JSON.stringify(x,(_,v)=>v&&typeof v==='object'&&!Array.isArray(v)?Object.fromEntries(Object.keys(v).sort().map(k=>[k,v[k]])):v);
      if(r.totals&&canonical(data.totals||D.totals(q))!==canonical(r.totals))

      if(JSON.stringify(capturedView(op.quoteContext))!==JSON.stringify(capturedView(D.sanitize(q))) ||

        throw {code:'CONFIRMATION_MISMATCH',message:'El contenido de la versión revisada no coincide con el envío.'};
